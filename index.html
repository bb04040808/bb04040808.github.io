<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレカ抽選まとめ|ポケカ・ワンピの抽選を締切が近い順に・毎日更新</title>
<meta property="og:title" content="トレカ抽選まとめ|ポケカ・ワンピの抽選を締切が近い順に">
<meta property="og:image" content="https://bb04040808.github.io/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="ポケカ・ワンピースカードの受付中の抽選・予約・Amazon招待販売を締切が近い順に一覧。全国応募OK・地域で絞り込み。毎日更新。">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e4e2dc;--accent:#d6452b;--ok:#1f7a4d;--soon:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
header{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 140% at 85% 100%,#3b2a8f 0%,#1d1d2b 55%,#141418 100%);padding:20px 16px 0;min-height:190px}
header::before{content:"";position:absolute;inset:0;background:radial-gradient(2px 2px at 12% 30%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 40% 70%,#fff6 50%,transparent 51%),radial-gradient(2px 2px at 58% 18%,#ffd76a99 50%,transparent 51%),radial-gradient(1.5px 1.5px at 30% 88%,#fff5 50%,transparent 51%);pointer-events:none}
.hwrap{position:relative;max-width:760px;margin:0 auto;min-height:170px}
.htext{position:relative;z-index:2;max-width:58%}
header h1{margin:0;font-size:22px;line-height:1.25;letter-spacing:.02em}
header h1 span{display:block;font-size:10px;font-weight:600;color:#ffd76a;letter-spacing:.12em;margin-bottom:4px}
header p{margin:6px 0 0;font-size:11px;color:#c9c9d6}
.mascot{position:absolute;right:-10px;bottom:0;height:140px;width:auto;z-index:1;filter:drop-shadow(0 6px 18px #0007);transform-origin:70% 100%;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.bubble{position:absolute;z-index:3;left:0;bottom:14px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:6px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 12px #0005;animation:pop .5s .5s cubic-bezier(.2,1.4,.4,1) both}
.bubble::after{content:"";position:absolute;right:-6px;bottom:8px;border:7px solid transparent;border-left-color:#fff;border-right:0}
.bubble b{color:var(--accent)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
@media (min-width:600px){header{min-height:220px}.hwrap{min-height:200px}.mascot{height:200px}.bubble{left:auto;right:300px;bottom:132px;font-size:13px}header h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){.mascot,.bubble{animation:none}}
main{max-width:760px;margin:0 auto;padding:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.box h2{font-size:15px;margin:0 0 8px}
.pr{font-size:10px;border:1px solid var(--sub);color:var(--sub);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.amz a{display:block;text-decoration:none;color:inherit;padding:8px 0;border-top:1px dashed var(--line)}
.amz a:first-of-type{border-top:0}
.amz b{color:var(--accent)}
.amz small{display:block;color:var(--sub);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters label{font-size:13px}
select{max-width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.filters input[type=search]{flex:1 1 100%;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
.count{font-size:12px;color:var(--sub);margin:4px 2px 8px}
.chains{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-top:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chains::-webkit-scrollbar{display:none}
.chains button{flex:0 0 auto;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.chains button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dayh{position:sticky;top:0;z-index:5;font-size:13px;font-weight:800;margin:14px 0 6px;padding:6px 10px;background:var(--bg);border-left:4px solid var(--sub);border-radius:4px}
.dayh.today{border-left-color:var(--accent);color:var(--accent)}
.dayh small{font-weight:600;color:var(--sub);margin-left:6px}
h3{font-size:14px;margin:18px 2px 8px;color:var(--sub)}
.item{display:grid;grid-template-columns:76px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--ink)}
.when{text-align:center;border-right:1px solid var(--line);padding-right:8px}
.when .d{font-weight:700;font-size:15px}
.when .t{font-size:12px;color:var(--sub)}
.left{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:#fff;background:var(--sub);border-radius:6px;padding:1px 6px}
.left.hot{background:var(--accent)}
.left.warm{background:var(--soon)}
.prod{font-weight:700;font-size:15px}
.store{font-size:13px}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:#efeee9;color:#444}
.tag.nat{background:#e3f2ea;color:var(--ok);font-weight:700}
.tag.warn{background:#fdf0e6;color:#9a4a12}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;font-size:14px;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.off{background:linear-gradient(135deg,#fff8e1,#fff);border:1px solid #f0d58a;border-radius:12px;padding:10px 12px 4px;margin-bottom:12px}
.off h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.off .item{border-color:#f0d58a}
.tt{font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px;color:#fff}
.tt.p{background:#e3a300}.tt.o{background:#c8322f}
.tag.offi{background:#1d1d1f;color:#ffd76a;font-weight:800}
.sublead{font-size:12px;color:var(--sub);margin:-4px 0 4px}
.empty{color:var(--sub);font-size:13px;padding:8px}
footer{max-width:760px;margin:20px auto 40px;padding:0 14px;font-size:11px;color:var(--sub)}
footer a{color:var(--sub)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htext">
      <h1><span>TCG LOTTERY MATOME</span>トレカ<br>抽選まとめ</h1>
      <p id="updated">締切が近い順・毎日更新</p>
    </div>
    <div class="bubble" id="bubble">応募もれ、ゼロに！</div>
    <img class="mascot" src="mascot.webp" alt="サイトのマスコットのウサギ" width="480" height="336">
  </div>
</header>
<main>
  <section class="box amz" id="amazon">
    <h2>Amazonの招待販売・定価ページ<span class="pr">PR</span></h2>
  </section>

  <div class="tabs" id="tabs"><button data-t="" class="on">すべて</button><button data-t="ポケカ">ポケカ</button><button data-t="ワンピ">ワンピース</button></div>
  <section class="off" id="offBox"><h2>🏆 公式ストアの抽選・予約</h2><div id="official"></div></section>
  <section class="box">
    <div class="filters">
      <label class="chip"><input type="checkbox" id="fNat"> 全国OKだけ</label>
      <select id="fEntry"><option value="">応募方法:すべて</option><option>オンライン</option><option>SNS</option><option>店頭</option></select>
      <select id="fArea"><option value="">地域:すべて</option></select>
      <select id="fProd"><option value="">商品:すべて</option></select>
      <input type="search" id="fQ" placeholder="店名・地域で検索(例:ゲオ、大阪)" aria-label="店名・地域で検索">
    </div>
    <div class="chains" id="chains" aria-label="チェーン店で絞り込み"></div>
  </section>

  <div class="count" id="count"></div>
  <div id="open"></div>
  <h3 id="upHead">これから受付開始</h3>
  <div id="upcoming"></div>

  <section class="box" style="margin-top:18px" id="supBox">
    <h2><span id="supTitle"></span><span class="pr">PR</span></h2>
    <div class="sublead" id="supLead"></div>
    <div class="amz" id="supList"></div>
  </section>
</main>
<footer>
  <p>※抽選の条件・締切は変わることがあります。応募前に必ず各店の告知ページを確認してください。</p>
  <p>当サイトはAmazonアソシエイト・プログラムに参加しています。Amazonのリンクから購入されると、運営者に紹介料が入ることがあります。</p>
  <p>運営:<a href="https://x.com/BB04cc" target="_blank" rel="noopener">@BB04cc</a>(Xで抽選速報を配信中)</p>
</footer>
<script>
const WD="日月火水木金土";
const fmt=d=>{const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),k=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-t)/864e5);return k===0?"今日":k===1?"明日":`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;};
const hm=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isNat=i=>i.receive==="配送"||String(i.area).startsWith("全国");
const NZ=s=>String(s??"").normalize("NFKC").toLowerCase();
const CHAINS={"TSUTAYA":["tsutaya","蔦屋"],"カードラボ":["カードラボ"],"ブックオフ":["ブックオフ","bookoff"],"カードボックス":["カードボックス","cardbox","kabos"],"ゲオ":["ゲオ","geo"],"ふるいち・古本市場":["ふるいち","古本市場"],"トレカエース":["トレカエース","ブックエース"],"トレカチャンピオン":["トレカチャンピオン","ビデオインアメリカ"],"三洋堂":["三洋堂"],"文真堂":["文真堂"],"バトロコ":["バトロコ"],"通販・配送":["__deliv"]};
let TAB="",CHAIN="";
function left(ms){
  const h=ms/36e5;
  if(h<1)return["あと"+Math.max(1,Math.round(ms/6e4))+"分","hot"];
  if(h<24)return["あと"+Math.floor(h)+"時間","hot"];
  const d=Math.floor(h/24);
  return["あと"+d+"日",d<3?"warm":""];
}
function card(i,now,up){
  const ref=up?new Date(i.start):(i.end?new Date(i.end):null);
  let when='<div class="d">受付中</div><div class="t">締切未定</div>';
  if(ref){
    const [txt,cls]=up?["受付前",""]:left(ref-now);
    when=`<div class="d">${fmt(ref)}</div><div class="t">${up?"開始 ":""}${hm(ref)}</div><span class="left ${cls}">${txt}</span>`;
  }
  const url=i.url||("https://x.com/search?q="+encodeURIComponent(i.store+" "+i.product.replace(/\(.*\)/,"")+" 抽選"));
  const tags=[
    i.official?'<span class="tag offi">公式</span>':"",
    isNat(i)?'<span class="tag nat">全国OK</span>':`<span class="tag">${esc(i.area)}</span>`,
    `<span class="tag">応募:${esc(i.entry)}</span>`,
    `<span class="tag">受取:${esc(i.receive)}</span>`,
    i.url?"":'<span class="tag warn">告知をXで検索</span>',
    up&&i.end?`<span class="tag">締切 ${fmt(new Date(i.end))} ${hm(new Date(i.end))}</span>`:"",
    i.note?`<span class="tag">${esc(i.note)}</span>`:""
  ].join("");
  return `<a class="item" href="${esc(url)}" target="_blank" rel="noopener"><div class="when">${when}</div><div><div class="prod"><span class="tt ${i.title==="ワンピ"?"o":"p"}">${i.title==="ワンピ"?"ワンピ":"ポケカ"}</span> ${esc(i.product)}</div><div class="store">${esc(i.store)}</div><div class="tags">${tags}</div></div></a>`;
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(data=>{
  const u=new Date(data.updated);
  document.getElementById("updated").innerHTML=`締切が近い順<br>${fmt(u)} ${hm(u)} 更新`;
  {const n=new Date(),k=data.items.filter(i=>i.end&&!(i.start&&new Date(i.start)>n)&&new Date(i.end)>n&&new Date(i.end)-n<864e5).length;
   if(k)document.getElementById("bubble").innerHTML=`24時間以内に締切 <b>${k}件</b>！`;}
  const amz=document.getElementById("amazon");
  data.amazon.forEach(a=>amz.insertAdjacentHTML("beforeend",
    `<a href="${esc(a.url)}" target="_blank" rel="sponsored noopener"><b>${esc(a.type)}</b> ${esc(a.title)} ${esc(a.product)}<small>${esc(a.note)}</small></a>`));
  const sp=data.supplies;
  if(sp&&sp.items&&sp.items.length){document.getElementById("supTitle").textContent=sp.title;document.getElementById("supLead").textContent=sp.lead||"";
    document.getElementById("supList").innerHTML=sp.items.map(x=>`<a href="https://www.amazon.co.jp/dp/${esc(x.asin)}?tag=bb0404-22" target="_blank" rel="sponsored noopener">${esc(x.name)}<small>${esc(x.note)}</small></a>`).join("");}
  else document.getElementById("supBox").style.display="none";
  const fill=(id,vals)=>{const s=document.getElementById(id);[...new Set(vals)].sort().forEach(v=>s.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`))};
  fill("fArea",data.items.map(i=>i.area));
  const fillProd=()=>{const s=document.getElementById("fProd");s.innerHTML='<option value="">商品:すべて</option>';fill("fProd",data.items.filter(i=>!TAB||i.title===TAB).map(i=>i.product.replace(/\(.*\)/,"")));};
  fillProd();
  const render=()=>{
    const now=new Date();
    const nat=fNat.checked,en=fEntry.value,ar=fArea.value,pr=fProd.value,q=fQ.value.trim().toLowerCase();
    const ck=CHAINS[CHAIN]||null;
    const hitQ=i=>(!q||NZ([i.store,i.area,i.product,i.entry,i.receive].join(" ")).includes(NZ(q)))&&(!ck||ck.some(k=>k==="__deliv"?i.receive==="配送":NZ(i.store).includes(k)));
    const alive=data.items.filter(i=>(!i.end||new Date(i.end)>now)&&(!TAB||i.title===TAB));
    const offs=alive.filter(i=>i.official).sort((a,b)=>(a.end?new Date(a.end):9e15)-(b.end?new Date(b.end):9e15));
    document.getElementById("official").innerHTML=offs.map(i=>card(i,now,i.start&&new Date(i.start)>now)).join("");
    document.getElementById("offBox").style.display=offs.length?"":"none";
    const list=alive.filter(i=>!i.official&&(!i.end||new Date(i.end)>now)
      &&(!nat||isNat(i))&&(!en||i.entry===en)&&(!ar||i.area===ar)&&(!pr||i.product.startsWith(pr))&&hitQ(i));
    const isUp=i=>i.start&&new Date(i.start)>now;
    const open=list.filter(i=>!isUp(i)).sort((a,b)=>(a.end?new Date(a.end):9e15)-(b.end?new Date(b.end):9e15));
    const up=list.filter(isUp).sort((a,b)=>new Date(a.start)-new Date(b.start));
    const dk=i=>i.end?fmt(new Date(i.end)):"締切未定";const cnt={};open.forEach(i=>{const k=dk(i);cnt[k]=(cnt[k]||0)+1});let prev=null;
    document.getElementById("open").innerHTML=open.map(i=>{const k=dk(i);const h=k!==prev?`<div class="dayh${k==="今日"?" today":""}">${k==="今日"||k==="明日"?k+"締切":k+" 締切"}<small>${cnt[k]}件</small></div>`:"";prev=k;return h+card(i,now,false)}).join("")||'<div class="empty">条件に合う受付中の抽選はありません</div>';
    document.getElementById("upcoming").innerHTML=up.map(i=>card(i,now,true)).join("");
    document.getElementById("upHead").style.display=up.length?"":"none";
    document.getElementById("count").textContent=`受付中 ${open.length}件・これから ${up.length}件(締切を過ぎたものは自動で消えます)`;
  };
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));fillProd();render();}));
  ["fNat","fEntry","fArea","fProd"].forEach(id=>document.getElementById(id).addEventListener("change",render));
  fQ.addEventListener("input",render);
  const ch=document.getElementById("chains");
  ch.innerHTML=Object.keys(CHAINS).map(k=>`<button type="button" data-c="${esc(k)}">${esc(k)}</button>`).join("");
  ch.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;CHAIN=CHAIN===b.dataset.c?"":b.dataset.c;ch.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.c===CHAIN));render();});
  render();setInterval(render,60000);
});
</script>
</body>
</html>
